name: Python application
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q client manage.py
      - run: mkdir -p client/api && python -m grpc_tools.protoc -I proto --python_out=client/api --grpc_python_out=client/api proto/api.proto
      - run: sed -i 's/^import api_pb2 as/from . import api_pb2 as/' client/api/api_pb2_grpc.py
      - run: python manage.py check
