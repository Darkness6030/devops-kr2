pid /tmp/kr2-nginx.pid;
error_log /tmp/kr2-nginx-error.log;
events { worker_connections 128; }
http {
 access_log /tmp/kr2-nginx-access.log;
 server {
  listen 127.0.0.1:9448 ssl http2;
  ssl_certificate /work/certs/server.pem;
  ssl_certificate_key /work/certs/server-key.pem;
  ssl_client_certificate /work/certs/ca.pem;
  ssl_verify_client on;
  location / { grpc_pass grpc://127.0.0.1:50051; }
  location /nginx_status { stub_status; allow 127.0.0.1; deny all; }
 }
}
